name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'arena/**'
    paths:
      - 'android/**'
      - 'Client/**'
      - '3rdparty/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK & install NDK/CMake
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMGR="$(command -v sdkmanager || find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SDKMGR" ]; then
            echo "::error::Could not find sdkmanager under $SDK_DIR"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.30.5"
          echo "$SDK_DIR/cmake/3.30.5/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon --console=plain 2>&1 | tee /tmp/gradle-build.log; then
            tail -n 120 /tmp/gradle-build.log | python3 -c '
          import sys
          lines = [l.rstrip("\n") for l in sys.stdin if l.strip()]
          chunk = "\n".join(lines[-40:])
          print("::error::Gradle build failed:\n" + chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          '
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrbx-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
